name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/karen1554/gart-gallery/backend-api:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: 'VNet-Produccion'
          containerAppName: 'backend-api'
          imageToDeploy: ghcr.io/karen1554/gart-gallery/backend-api:latest

      - name: Test Endpoint / Health Check (HTTP)
        run: |
          echo "Verificando respuesta del servicio..."
          curl -f -k https://backend-api.lemonbeach-47d15485.eastus.azurecontainerapps.io/ || echo "Prueba ejecutada (si el ingreso es interno, solo responderá dentro de la VNet)."
