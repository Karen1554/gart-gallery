services:
  - type: web
    name: gart-gallery
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: gart-gallery-gallery
    env: python
    plan: free
    buildCommand: pip install -r services/requirements.txt
    startCommand: PYTHONPATH=services uvicorn --app-dir services/gallery-service app:app --host 0.0.0.0 --port 3001
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

  - type: web
    name: gart-gallery-works
    env: python
    plan: free
    buildCommand: pip install -r services/requirements.txt
    startCommand: PYTHONPATH=services uvicorn --app-dir services/works-service app:app --host 0.0.0.0 --port 3002
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

  - type: web
    name: gart-gallery-auth
    env: python
    plan: free
    buildCommand: pip install -r services/requirements.txt
    startCommand: PYTHONPATH=services uvicorn --app-dir services/auth-service app:app --host 0.0.0.0 --port 3003
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: gart-gallery-purchase
    env: python
    plan: free
    buildCommand: pip install -r services/requirements.txt
    startCommand: PYTHONPATH=services uvicorn --app-dir services/purchase-service app:app --host 0.0.0.0 --port 3004
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

  - type: web
    name: gart-gallery-content
    env: python
    plan: free
    buildCommand: pip install -r services/requirements.txt
    startCommand: PYTHONPATH=services uvicorn --app-dir services/content-service app:app --host 0.0.0.0 --port 3005
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: gart-gallery-db
    plan: free
