apiVersion: v1
kind: Namespace
metadata:
  name: gart-gallery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gart-gallery-frontend
  namespace: gart-gallery
  labels:
    app.kubernetes.io/name: gart-gallery-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gart-gallery-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gart-gallery-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: gart-gallery-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gart-gallery-frontend
  namespace: gart-gallery
  labels:
    app.kubernetes.io/name: gart-gallery-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gart-gallery-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
